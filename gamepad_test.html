<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gamepad Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        .controller { margin: 20px 0; padding: 10px; border: 1px solid #0f0; }
        .button { display: inline-block; width: 60px; height: 30px; margin: 2px;
                  background: #333; border: 1px solid #0f0; text-align: center; line-height: 30px; }
        .button.pressed { background: #0f0; color: #000; }
        .axis { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Gamepad Test</h1>
    <div id="status">等待手柄连接...</div>
    <div id="controllers"></div>

    <script>
        const status = document.getElementById('status');
        const controllers = document.getElementById('controllers');

        function updateStatus() {
            const gamepads = navigator.getGamepads();
            let found = false;

            controllers.innerHTML = '';

            for (let i = 0; i < gamepads.length; i++) {
                const gp = gamepads[i];
                if (!gp) continue;

                found = true;

                const div = document.createElement('div');
                div.className = 'controller';

                let html = `<h3>手柄 ${i}: ${gp.id}</h3>`;
                html += `<p>按钮 (${gp.buttons.length}):</p>`;

                gp.buttons.forEach((btn, idx) => {
                    const pressed = btn.pressed ? ' pressed' : '';
                    html += `<div class="button${pressed}">${idx}: ${btn.value.toFixed(2)}</div>`;
                });

                html += `<p>摇杆:</p>`;
                for (let j = 0; j < gp.axes.length; j++) {
                    html += `<div class="axis">轴 ${j}: ${gp.axes[j].toFixed(3)}</div>`;
                }

                div.innerHTML = html;
                controllers.appendChild(div);
            }

            status.textContent = found ? `找到 ${gamepads.filter(g => g).length} 个手柄` : '未检测到手柄';
            requestAnimationFrame(updateStatus);
        }

        window.addEventListener('gamepadconnected', (e) => {
            console.log('手柄已连接:', e.gamepad);
        });

        window.addEventListener('gamepaddisconnected', (e) => {
            console.log('手柄已断开:', e.gamepad);
        });

        updateStatus();
    </script>
</body>
</html>
